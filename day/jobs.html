<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求人一覧｜NOX WORK</title><style>
:root{font-family:system-ui,sans-serif;color:#fff;background:#08080a}body{margin:0}header{padding:18px 5%;border-bottom:1px solid #333}main{max-width:1100px;margin:auto;padding:28px 5%}h1{color:#ffd54a}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}input,select{padding:11px;border-radius:8px;background:#16161b;color:#fff;border:1px solid #444}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.card{background:#17171c;border:1px solid #303038;border-radius:15px;overflow:hidden}.card img{width:100%;height:180px;object-fit:cover}.body{padding:16px}.tag{color:#ffd54a}.button{display:inline-block;padding:10px 16px;background:#ffd54a;color:#111;text-decoration:none;border-radius:8px;font-weight:800}.muted{color:#aaa}</style></head><body><header><a href="./index.html">NOX WORK</a></header><main><h1>一般求人一覧</h1><div class="filters"><input id="keyword" placeholder="企業名・職種・勤務地"><select id="industry"><option value="">すべての業種</option></select></div><div id="status" class="muted">読み込み中...</div><div id="jobs" class="grid"></div></main><script type="module">
import { getFunctions,httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";import "../pages/firebase-db.js";
const fn=httpsCallable(getFunctions(undefined,"asia-northeast1"),"getPublicWorkJobs"),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let all=[];
function render(){const q=document.getElementById("keyword").value.trim().toLowerCase(),industry=document.getElementById("industry").value;const rows=all.filter(j=>(!industry||j.industry===industry)&&(!q||[j.companyName,j.title,j.occupation,j.location].join(" ").toLowerCase().includes(q)));document.getElementById("jobs").innerHTML=rows.map(j=>`<article class="card">${j.mainImageUrl?`<img src="${esc(j.mainImageUrl)}" alt="">`:""}<div class="body"><div class="tag">${esc(j.industry)} / ${esc(j.employmentType)}</div><h2>${esc(j.title)}</h2><p>${esc(j.companyName)}</p><p>${esc(j.location)}<br>${esc(j.salary)}</p><a class="button" href="./job-detail.html?id=${encodeURIComponent(j.jobId)}">求人詳細</a></div></article>`).join("");document.getElementById("status").textContent=rows.length?`${rows.length}件`:"該当する求人はありません。"}
try{all=(await fn({})).data.jobs||[];document.getElementById("industry").innerHTML+=[...new Set(all.map(j=>j.industry).filter(Boolean))].map(v=>`<option>${esc(v)}</option>`).join("");render()}catch{document.getElementById("status").textContent="求人を読み込めませんでした。"}document.getElementById("keyword").oninput=render;document.getElementById("industry").onchange=render;
</script></body></html>
