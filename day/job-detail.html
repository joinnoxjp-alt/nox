<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求人詳細｜NOX WORK</title><style>
:root{font-family:system-ui,sans-serif;color:#fff;background:#08080a}body{margin:0}header{padding:18px 5%;border-bottom:1px solid #333}main{max-width:900px;margin:auto;padding:28px 5%}.hero{width:100%;max-height:430px;object-fit:cover;border-radius:16px}.logo{width:72px;height:72px;object-fit:contain;border-radius:12px;background:#fff}.section{background:#17171c;border:1px solid #303038;border-radius:15px;padding:20px;margin:18px 0}h1,h2{color:#ffd54a}.row{white-space:pre-wrap;line-height:1.8}.apply{display:block;text-align:center;padding:16px;background:#ffd54a;color:#111;text-decoration:none;border-radius:10px;font-weight:900}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.gallery img{width:100%;border-radius:10px}.links{display:flex;gap:12px;flex-wrap:wrap}.links a{color:#ffd54a}</style></head><body><header><a href="./jobs.html">← NOX WORK求人一覧</a></header><main id="root">読み込み中...</main><script type="module">
import { getFunctions,httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";import "../pages/firebase-db.js";const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const id=new URLSearchParams(location.search).get("id"),root=document.getElementById("root");
function applyHref(j){if(j.applyType==="email")return `mailto:${encodeURIComponent(j.applyValue)}`;if(j.applyType==="phone")return `tel:${String(j.applyValue).replace(/[^+0-9]/g,"")}`;try{const u=new URL(j.applyValue);return ["http:","https:"].includes(u.protocol)?u.href:""}catch{return""}}
try{const j=(await httpsCallable(getFunctions(undefined,"asia-northeast1"),"getPublicWorkJob")({jobId:id})).data.job,href=applyHref(j);root.innerHTML=`${j.mainImageUrl?`<img class="hero" src="${esc(j.mainImageUrl)}" alt="">`:""}<section class="section">${j.logoUrl?`<img class="logo" src="${esc(j.logoUrl)}" alt="">`:""}<h1>${esc(j.title)}</h1><p>${esc(j.companyName)}｜${esc(j.industry)}｜${esc(j.occupation)}</p><p>${esc(j.employmentType)}　${esc(j.salary)}</p></section>${href?`<a class="apply" href="${esc(href)}" ${href.startsWith("http")?'target="_blank" rel="noopener noreferrer"':""}>応募する</a>`:""}<section class="section"><h2>勤務地・勤務条件</h2><div class="row">勤務地：${esc(j.location)}\n最寄り駅：${esc(j.station)||"未設定"}\n勤務時間：${esc(j.workHours)||"未設定"}\n休日：${esc(j.holidays)||"未設定"}\n年齢条件：${esc(j.ageRequirement)||"未設定"}\n未経験：${j.beginnerWelcome?"歓迎":"要確認"}</div></section><section class="section"><h2>仕事内容</h2><div class="row">${esc(j.description)}</div></section><section class="section"><h2>応募資格</h2><div class="row">${esc(j.requirements)||"未設定"}</div></section><section class="section"><h2>待遇／福利厚生</h2><div class="row">${esc(j.benefits)||"未設定"}</div></section>${j.imageUrls?.length?`<section class="section"><h2>求人画像</h2><div class="gallery">${j.imageUrls.map(u=>`<img src="${esc(u)}" alt="">`).join("")}</div></section>`:""}<section class="section"><h2>企業公式リンク</h2><div class="links">${[["公式LINE",j.lineUrl],["Instagram",j.instagramUrl],["X",j.xUrl],["TikTok",j.tiktokUrl],["Webサイト",j.websiteUrl]].filter(x=>x[1]).map(x=>`<a href="${esc(x[1])}" target="_blank" rel="noopener noreferrer">${x[0]}</a>`).join("")}</div></section>`}catch{root.textContent="求人が見つからないか、現在掲載されていません。"}
</script></body></html>
