<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOX | 店舗掲載申請</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      color: #fff;
      background: #080808;
      font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }
    main { width: min(720px, 100%); margin: 0 auto; }
    .panel {
      padding: 28px;
      border: 1px solid #333;
      border-radius: 18px;
      background: #151515;
    }
    h1 { margin: 0 0 8px; }
    .lead, .note { color: #ccc; line-height: 1.7; }
    .note {
      padding: 14px;
      border-left: 3px solid #d7b25b;
      background: #202020;
    }
    label { display: block; margin: 20px 0 8px; font-weight: 700; }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #555;
      border-radius: 8px;
      color: #fff;
      background: #0d0d0d;
      font: inherit;
    }
    textarea { min-height: 110px; resize: vertical; }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      color: #111;
      background: #d7b25b;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: .6; }
    .required { color: #ff8e8e; font-size: 12px; }
    .message { min-height: 24px; margin-top: 16px; line-height: 1.5; }
    .message.error { color: #ff9b9b; }
    .message.success { color: #9ee6b0; }
    .back { display: inline-block; margin-top: 18px; color: #ddd; }
    .pricing-panel { margin-bottom: 20px; }
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin: 16px 0;
    }
    .pricing-plan-card {
      padding: 14px;
      border: 1px solid #393939;
      border-radius: 12px;
      background: #0d0d0d;
    }
    .pricing-plan-card h3 { margin: 0 0 8px; font-size: 16px; }
    .pricing-plan-card .price { margin: 0; color: #d7b25b; font-weight: 700; }
    .pricing-option {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #333;
    }
    .pricing-flow { margin: 12px 0 0; padding-left: 22px; line-height: 1.8; }
    .pricing-error { color: #ffb0b0; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <section class="panel pricing-panel" aria-labelledby="pricingHeading">
      <h2 id="pricingHeading">掲載料金のご案内</h2>
      <div id="pricingContent" aria-live="polite">
        <p class="lead">料金情報を読み込んでいます。</p>
      </div>
      <div id="pricingDetails" hidden>
        <div id="pricingPlans" class="pricing-grid"></div>
        <p id="pricingPaymentNote" class="note"></p>
        <h3>オプション料金</h3>
        <div id="pricingOptions"></div>
        <h3>掲載までの流れ</h3>
        <ol id="pricingFlow" class="pricing-flow"></ol>
        <p class="lead">
          申請時点ではプラン選択や請求は確定しません。
          NOX運営から内容をご案内します。
        </p>
      </div>
    </section>

    <section class="panel">
      <h1>店舗掲載申請</h1>
      <p class="lead">
        NOXへの店舗・企業掲載をご希望の方は、以下の情報を送信してください。
        この申請は求人掲載申請とは別に管理されます。
      </p>
      <p class="note">
        申請内容の確認後、承認された方へ店舗アカウント登録用の招待をご案内します。
        この画面ではアカウントや店舗データは作成しません。
      </p>

      <form id="storeApplicationForm">
        <label for="storeName">店舗・企業名 <span class="required">必須</span></label>
        <input id="storeName" maxlength="120" autocomplete="organization" required>

        <label for="businessScope">掲載区分 <span class="required">必須</span></label>
        <select id="businessScope" required>
          <option value="night">夜職求人</option>
          <option value="general">一般求人</option>
          <option value="both">夜職求人・一般求人の両方</option>
        </select>

        <label for="businessType">業種 <span class="required">必須</span></label>
        <input id="businessType" maxlength="120" placeholder="例：飲食店、美容サロン、キャバクラ" required>

        <label for="area">地域 <span class="required">必須</span></label>
        <input id="area" maxlength="120" placeholder="例：東京都新宿区" required>

        <label for="address">所在地</label>
        <input id="address" maxlength="240" autocomplete="street-address">

        <label for="contactName">担当者名 <span class="required">必須</span></label>
        <input id="contactName" maxlength="120" autocomplete="name" required>

        <label for="contactEmail">連絡先メールアドレス <span class="required">必須</span></label>
        <input id="contactEmail" type="email" maxlength="254" autocomplete="email" required>

        <label for="contactPhone">連絡先電話番号</label>
        <input id="contactPhone" type="tel" maxlength="30" autocomplete="tel">

        <label for="notes">補足事項</label>
        <textarea id="notes" maxlength="2000"></textarea>

        <button id="submitButton" type="submit">店舗掲載を申請する</button>
        <div id="formMessage" class="message" role="status" aria-live="polite"></div>
      </form>
    </section>
    <a class="back" href="../owner.html">掲載案内へ戻る</a>
  </main>

  <script type="module">
    import { db } from "./firebase.js";
    import {
      createPricingDisplayModel,
      loadPricingCatalog,
      renderApplicationFlow,
      renderPricingError,
      renderPricingOptions,
      renderPricingPlans
    } from "./pricing.js";
    import {
      addDoc,
      collection,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const form = document.getElementById("storeApplicationForm");
    const submitButton = document.getElementById("submitButton");
    const formMessage = document.getElementById("formMessage");
    const allowedBusinessScopes = new Set(["night", "general", "both"]);
    const pricingContent = document.getElementById("pricingContent");
    const pricingDetails = document.getElementById("pricingDetails");

    const valueOf = (id) =>
      document.getElementById(id).value.trim();

    async function showPricing() {
      try {
        const model = createPricingDisplayModel(
          await loadPricingCatalog()
        );
        renderPricingPlans(
          document.getElementById("pricingPlans"),
          model
        );
        renderPricingOptions(
          document.getElementById("pricingOptions"),
          model
        );
        renderApplicationFlow(
          document.getElementById("pricingFlow"),
          model
        );
        document.getElementById("pricingPaymentNote").textContent =
          model.paymentNote;
        pricingContent.replaceChildren();
        pricingDetails.hidden = false;
      } catch {
        pricingDetails.hidden = true;
        renderPricingError(pricingContent);
      }
    }

    showPricing();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      formMessage.textContent = "";
      formMessage.className = "message";

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const businessScope = valueOf("businessScope");
      if (!allowedBusinessScopes.has(businessScope)) {
        formMessage.textContent = "掲載区分を選び直してください。";
        formMessage.className = "message error";
        return;
      }

      submitButton.disabled = true;

      try {
        await addDoc(collection(db, "storeApplications"), {
          storeName: valueOf("storeName"),
          businessScope,
          businessType: valueOf("businessType"),
          area: valueOf("area"),
          address: valueOf("address"),
          contactName: valueOf("contactName"),
          contactEmail: valueOf("contactEmail").toLowerCase(),
          contactPhone: valueOf("contactPhone"),
          notes: valueOf("notes"),
          status: "pending",
          schemaVersion: 1,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });

        form.reset();
        formMessage.textContent =
          "店舗掲載申請を受け付けました。内容確認後にご連絡します。";
        formMessage.className = "message success";
      } catch (error) {
        console.error("店舗掲載申請の送信に失敗しました。");
        formMessage.textContent =
          "申請を送信できませんでした。時間を置いて再度お試しください。";
        formMessage.className = "message error";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
