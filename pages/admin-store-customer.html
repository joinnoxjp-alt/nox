<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店舗来店・予約管理 | NOX ADMIN</title><link rel="stylesheet" href="./store-customer.css"></head><body class="store-customer admin-customer"><main class="store-shell"><nav class="store-nav"><a href="./admin.html">← 管理者ページ</a><strong>NOX 店舗来店・予約管理</strong></nav><p id="status">管理者認証を確認しています…</p><section class="store-section"><h1>店舗ページ編集</h1><label>店舗検索 <input id="search" placeholder="店舗名・ID"></label><label>対象店舗 <select id="storeSelect"><option value="">選択してください</option></select></label></section><form id="editor" class="store-section store-form" hidden><label>公開状態<select name="status"><option value="draft">下書き</option><option value="published">公開</option><option value="stopped">掲載停止</option></select></label><label><span>店舗ページ機能</span><select name="enabled"><option value="false">無効</option><option value="true">有効</option></select></label><label>表示店舗名<input name="storeName"></label><label>業種<input name="category"></label><label class="full">紹介文<textarea name="description"></textarea></label><label>住所<input name="address"></label><label>最寄り駅<input name="station"></label><label>営業時間<input name="businessHours"></label><label>定休日<input name="closedDay"></label><label>予約電話<input name="phone" type="tel"></label><label>LINE URL<input name="lineUrl" type="url"></label><label>Instagram<input name="instagramUrl" type="url"></label><label>X<input name="xUrl" type="url"></label><label>TikTok<input name="tiktokUrl" type="url"></label><label>Webサイト<input name="websiteUrl" type="url"></label><label>外部予約URL<input name="externalReservationUrl" type="url"></label><fieldset class="full"><legend>予約方法</legend><label><input name="reservationFormEnabled" type="checkbox"> NOX予約フォーム</label><label><input name="lineReservationEnabled" type="checkbox"> LINE</label><label><input name="phoneReservationEnabled" type="checkbox"> 電話</label><label><input name="externalReservationEnabled" type="checkbox"> 外部予約</label></fieldset><label class="full">料金（1行: 項目 | 料金 | 注記）<textarea name="pricesText" rows="6"></textarea></label><fieldset class="full"><legend>NOX限定特典</legend><label><input name="benefitEnabled" type="checkbox"> 表示する</label><label>タイトル<input name="benefitTitle"></label><label>内容<textarea name="benefitContent"></textarea></label><label>条件<input name="benefitConditions"></label><label>注意事項<input name="benefitNotes"></label><label>期限<input name="benefitExpiresAt" type="date"></label></fieldset><label>メイン画像<input id="mainFile" type="file" accept="image/jpeg,image/png,image/webp"></label><label>カバー画像<input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="full">ギャラリー（追加・最大20枚）<input id="galleryFiles" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="imagePreview" class="store-gallery full"></div><button class="store-button full" type="submit">保存</button></form><section class="store-section"><h2>予約一覧</h2><div id="reservations">店舗を選択してください。</div></section><section class="store-section"><h2>来店導線実績</h2><div id="analytics">店舗を選択してください。</div></section></main><script type="module" src="./admin-store-customer.js"></script></body></html>
