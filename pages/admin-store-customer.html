<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>店舗予約・遊びに行く情報管理 | NOX ADMIN</title>
  <link rel="stylesheet" href="./store-customer.css">
</head>
<body class="store-customer admin-customer">
  <main class="store-shell">
    <nav class="store-nav"><a href="./admin.html">← 管理者ページ</a><strong>NOX 店舗予約・遊びに行く情報管理</strong></nav>
    <p id="status" role="status">管理者認証を確認しています…</p>
    <section class="store-section">
      <h1>店舗ページ編集</h1>
      <div class="admin-store-picker">
        <label>店舗名検索 <input id="search" placeholder="店舗名・ID"></label>
        <label>対象店舗 <select id="storeSelect"><option value="">選択してください</option></select></label>
      </div>
      <dl id="selectedStoreMeta" class="admin-store-meta" hidden>
        <div><dt>店舗ID</dt><dd id="selectedStoreId">-</dd></div>
        <div><dt>現在の公開状態</dt><dd id="selectedStoreStatus">-</dd></div>
      </dl>
    </section>
    <form id="editor" class="store-section store-form" hidden>
      <label>公開状態<select name="status"><option value="draft">下書き</option><option value="published">公開</option><option value="stopped">掲載停止</option></select></label>
      <label><span>店舗ページ機能</span><select name="enabled"><option value="false">無効</option><option value="true">有効</option></select></label>
      <label>表示店舗名<input name="storeName"></label><label>業種<input name="category"></label>
      <label class="full">紹介文<textarea name="description"></textarea></label>
      <label>住所<input name="address"></label><label>最寄り駅<input name="station"></label>
      <label>営業時間<input name="businessHours"></label><label>定休日<input name="closedDay"></label>
      <label>予約電話番号<input name="phone" type="tel"></label><label>LINE URL<input name="lineUrl" type="url"></label>
      <label>Instagram URL<input name="instagramUrl" type="url"></label><label>TikTok URL<input name="tiktokUrl" type="url"></label>
      <label>X URL<input name="xUrl" type="url"></label><label>公式サイトURL<input name="websiteUrl" type="url"></label>
      <fieldset class="full"><legend>予約方法</legend>
        <label><input name="reservationFormEnabled" type="checkbox"> NOX予約フォーム</label>
        <label><input name="phoneReservationEnabled" type="checkbox"> 電話予約</label>
        <label><input name="lineReservationEnabled" type="checkbox"> LINE予約</label>
        <label><input name="instagramReservationEnabled" type="checkbox"> Instagram DM</label>
        <label><input name="xReservationEnabled" type="checkbox"> X DM</label>
        <label><input name="tiktokReservationEnabled" type="checkbox"> TikTok</label>
        <label><input name="externalReservationEnabled" type="checkbox"> 外部予約</label>
        <div id="externalReservationFields" class="conditional-fields">
          <label>外部予約URL<input name="externalReservationUrl" type="url"></label>
          <label>外部予約ボタン名<input name="externalReservationLabel" maxlength="80" placeholder="予約サイトへ"></label>
        </div>
      </fieldset>
      <label class="full">料金（1行: 項目 | 料金 | 注記）<textarea name="pricesText" rows="7" placeholder="60分 | 3,000円 | 税・サービス料10％"></textarea></label>
      <fieldset class="full"><legend>NOX限定特典</legend>
        <label><input name="benefitEnabled" type="checkbox"> 表示する</label>
        <label>タイトル<input name="benefitTitle"></label><label>内容<textarea name="benefitContent"></textarea></label>
        <label>条件<input name="benefitConditions"></label><label>注意事項<input name="benefitNotes"></label>
        <label>期限<input name="benefitExpiresAt" type="date"></label>
      </fieldset>
      <label class="full">プロフィール用メイン画像<input id="mainFile" type="file" accept="image/jpeg,image/png,image/webp"></label>
      <label class="full">その他画像（追加・複数選択可、最大20枚）<input id="galleryFiles" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
      <div id="imagePreview" class="store-gallery full"></div>
      <button class="store-button full" type="submit">変更を保存</button>
    </form>
    <section class="store-section reservation-management"><h2>予約一覧</h2><div id="reservations">店舗を選択してください。</div></section>
    <section class="store-section analytics-management"><h2>来店導線実績</h2><div id="analytics">店舗を選択してください。</div></section>
  </main>
  <script type="module" src="./admin-store-customer.js"></script>
</body>
</html>
