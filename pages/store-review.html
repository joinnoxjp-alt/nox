<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>掲載店舗様アンケート | NOX</title><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f7f3e8;font-family:"Noto Sans JP",sans-serif}.shell{max-width:760px;margin:auto;padding:42px 18px 70px}.head{text-align:center;margin-bottom:30px}.head b{color:#c9a64b;letter-spacing:.18em}.head h1{font-size:clamp(25px,6vw,38px)}.card{padding:clamp(20px,5vw,38px);border:1px solid #8e752f;border-radius:20px;background:#111;box-shadow:0 18px 60px #000}.store-preview{display:flex;align-items:center;gap:14px;padding:15px;border:1px solid #393017;border-radius:12px;margin-bottom:24px}.store-preview img{width:58px;height:58px;object-fit:cover;border-radius:50%;background:#fff}.field{margin:0 0 24px}.field>label,.legend{display:block;margin-bottom:9px;font-weight:700}.required{color:#d7b650;font-size:12px}input,select,textarea{width:100%;padding:13px;border:1px solid #555;border-radius:9px;background:#191919;color:#fff;font:inherit}textarea{min-height:120px;resize:vertical}.stars{display:flex;flex-direction:row-reverse;justify-content:flex-end}.stars input{position:absolute;opacity:0}.stars label{padding:2px;font-size:34px;color:#555;cursor:pointer}.stars input:checked~label,.stars label:hover,.stars label:hover~label{color:#d4af4d}.check{display:flex;gap:10px;line-height:1.7}.check input{width:auto;margin-top:6px;align-self:flex-start}.submit{width:100%;padding:16px;border:0;border-radius:9px;background:linear-gradient(90deg,#a9872e,#e0c269);color:#090909;font-weight:800;font-size:16px;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}.status{margin-top:18px;text-align:center;line-height:1.8}.success{color:#e4c86d}.error{color:#ff9e9e}.hidden{display:none}</style></head>
<body><main class="shell"><header class="head"><b>NOX</b><h1>掲載店舗様アンケート</h1><p>今後のサービス向上のため、率直なご意見をお聞かせください。</p></header><section class="card"><div id="storePreview" class="store-preview hidden"><img id="storeLogo" alt=""><strong id="lockedStoreName"></strong></div><form id="reviewForm" novalidate>
<div class="field" id="storeNameField"><label for="storeName">店舗名 <span class="required">必須</span></label><input id="storeName" name="storeName" maxlength="120" required autocomplete="organization"></div>
<div class="field"><label for="source">NOXを知ったきっかけ <span class="required">必須</span></label><select id="source" required><option value="">選択してください</option><option>DM</option><option>SNS</option><option>紹介</option><option>検索</option><option>その他</option></select></div>
<div class="field"><label for="reason">NOXへの掲載を決めた理由 <span class="required">必須</span></label><textarea id="reason" maxlength="1000" required></textarea></div>
<fieldset class="field"><legend class="legend">掲載までの流れはいかがでしたか？ <span class="required">必須</span></legend><div class="stars" id="flowStars"></div></fieldset>
<fieldset class="field"><legend class="legend">NOX運営の対応はいかがでしたか？ <span class="required">必須</span></legend><div class="stars" id="supportStars"></div></fieldset>
<div class="field"><label for="recommendation">他の店舗様にもおすすめしたいと思いますか？ <span class="required">必須</span></label><select id="recommendation" required><option value="">選択してください</option><option>ぜひおすすめしたい</option><option>おすすめしたい</option><option>どちらともいえない</option><option>あまり思わない</option></select></div>
<div class="field"><label for="comment">NOXを利用してみた感想 <span class="required">必須</span></label><textarea id="comment" maxlength="2000" required></textarea></div>
<div class="field"><label for="improvement">追加してほしいサービス・改善してほしい点（任意）</label><textarea id="improvement" maxlength="2000"></textarea></div>
<div class="field"><label for="publishPermission">掲載許可 <span class="required">必須</span></label><select id="publishPermission" required><option value="">選択してください</option><option value="named">店舗名を出して掲載OK</option><option value="anonymous">匿名であれば掲載OK</option><option value="none">掲載NG</option></select></div>
<label class="check field"><input type="checkbox" id="consent" required><span>回答内容をNOX公式サイト・SNS等で紹介する場合があることを確認しました</span></label><button class="submit" id="submitButton" type="submit">アンケートを送信する</button><p id="formStatus" class="status" role="status"></p></form></section></main><script type="module" src="./store-review.js"></script></body></html>
