<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PR・広告相談 | NOX公式アンバサダー</title><link rel="stylesheet" href="ambassadors.css"></head><body><main class="amb-shell"><header class="amb-head"><a class="amb-logo" href="../index.html">NOX</a><nav class="amb-nav"><a class="amb-btn" href="ambassadors.html">アンバサダー一覧</a></nav></header><section class="amb-section"><h1 class="amb-title">PR・広告のご相談</h1><p class="amb-lead">内容を確認後、NOXからご連絡します。アンバサダーへの直接連絡先は共有されません。</p><form class="amb-form" id="inquiryForm"><div class="amb-fields"><div class="amb-field"><label>会社名 / 店舗名 / ブランド名 *</label><input name="companyName" required maxlength="120"></div><div class="amb-field"><label>担当者名 *</label><input name="contactName" required maxlength="80"></div><div class="amb-field"><label>メールアドレス *</label><input name="email" type="email" required maxlength="254"></div><div class="amb-field"><label>電話番号</label><input name="phone" type="tel" maxlength="30"></div><div class="amb-field"><label>商品名 / サービス名 *</label><input name="productName" required maxlength="150"></div><div class="amb-field"><label>商品URL</label><input name="productUrl" type="url" maxlength="1000"></div><div class="amb-field"><label>希望アンバサダー</label><select name="ambassador"><option>NOXにおまかせ</option></select></div><div class="amb-field"><label>希望時期</label><input name="preferredTiming" maxlength="100"></div><div class="amb-field"><label>予算</label><input name="budget" maxlength="100" placeholder="例：10万円前後 / 要相談"></div><div class="amb-field"><label>商品提供</label><select name="productProvided"><option value="未定">未定</option><option value="あり">あり</option><option value="なし">なし</option></select></div><div class="amb-field full"><label>希望PR内容</label><div class="amb-checks"><label><input type="checkbox" name="channels" value="TikTok"> TikTok</label><label><input type="checkbox" name="channels" value="Instagram"> Instagram</label><label><input type="checkbox" name="channels" value="ストーリー"> ストーリー</label><label><input type="checkbox" name="channels" value="LIVE"> LIVE</label><label><input type="checkbox" name="channels" value="撮影モデル"> 撮影モデル</label><label><input type="checkbox" name="channels" value="その他"> その他</label></div></div><div class="amb-field full"><label>PR内容詳細 *</label><textarea name="details" required maxlength="3000"></textarea></div><div class="amb-field full"><label>その他要望</label><textarea name="requests" maxlength="2000"></textarea></div><div class="amb-field full"><button class="amb-btn gold" type="submit">NOXへ相談を送信</button><p class="amb-status" id="formStatus" aria-live="polite"></p></div></div></form></section></main><script type="module" src="ambassadors.js"></script></body></html>
