<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | NOX</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body class="register-body">
  <main class="register-page">
    <section class="register-section">
      <div class="register-card">
        <div class="register-step">
          <span>NOX LOGIN</span>
          <h2>ログイン</h2>
          <p>登録済みのメールアドレスでログインしてください。</p>
        </div>

        <form id="loginForm" class="nox-form">
          <label>
            メールアドレス
            <input type="email" id="email" autocomplete="email" required>
          </label>

          <label>
            パスワード
            <input type="password" id="password" autocomplete="current-password" required>
          </label>

          <button type="submit" id="loginButton" class="gold-btn">ログイン</button>
        </form>

        <p id="loginMessage" role="status" aria-live="polite"></p>

        <div class="header-actions">
          <a href="../index.html" class="btn ghost">トップへ戻る</a>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { auth } from "../firebase.js";
    import {
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import {
      getAccountAccess,
      getPostLoginPath
    } from "./account-authorization.js";

    const db = getFirestore();
    const form = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("loginMessage");

    function showMessage(text) {
      message.textContent = text;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginButton.disabled = true;
      showMessage("ログイン情報を確認しています。");

      try {
        const credential = await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        const user = credential.user;
        const userRef = doc(db, "users", user.uid);
        const userSnapshot = await getDoc(userRef);

        if (!userSnapshot.exists()) {
          await setDoc(userRef, {
            email: user.email || "",
            role: "user",
            status: "pending",
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
        }

        const access = await getAccountAccess(db, user);
        const destination = getPostLoginPath(access.kind);

        if (destination) {
          location.replace(destination);
          return;
        }

        if (access.kind === "pending") {
          showMessage("メール認証または登録手続きが完了していません。");
        } else if (access.kind === "blocked") {
          showMessage("このアカウントは現在利用停止中です。");
        } else {
          showMessage("アカウントの権限状態を確認できません。サポートへお問い合わせください。");
        }
      } catch {
        showMessage("ログインできませんでした。入力内容をご確認ください。");
      } finally {
        loginButton.disabled = false;
      }
    });
  </script>
</body>
</html>
