<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NOX | 求人詳細</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(
            circle at top,
            rgba(255, 215, 0, 0.18),
            transparent 35%
          ),
          linear-gradient(180deg, #050505, #000);
        color: #fff;
        font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      .page {
        max-width: 1100px;
        margin: auto;
        padding: 30px 18px 80px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }

      .logo {
        font-size: 40px;
        font-weight: 900;
        color: #ffd700;
        letter-spacing: 4px;
      }

      .logo small {
        display: block;
        font-size: 11px;
        color: #999;
        letter-spacing: 5px;
        margin-top: 5px;
      }

      .nav {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        padding: 14px 24px;
        border-radius: 999px;
        border: 1px solid rgba(255, 215, 0, 0.35);
        background: rgba(255, 255, 255, 0.04);
        color: #ffd700;
        font-weight: bold;
        cursor: pointer;
        transition: 0.25s;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn.gold {
        background: #ffd700;
        color: #000;
      }

      .hero {
        border: 1px solid rgba(255, 215, 0, 0.35);
        border-radius: 30px;
        padding: 35px;
        background:
          radial-gradient(
            circle at top right,
            rgba(255, 215, 0, 0.18),
            transparent 40%
          ),
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.08),
            rgba(255, 255, 255, 0.02)
          );
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
        margin-bottom: 24px;
      }

      .hero img {
        width: 100%;
        height: auto;
        max-height: 620px;
        object-fit: contain;
        border-radius: 22px;
        margin-bottom: 25px;
        background: #050505;
        cursor: zoom-in;
      }

      .kicker {
        font-size: 12px;
        letter-spacing: 5px;
        color: #ffd700;
        margin-bottom: 12px;
      }

      .hero h1 {
        font-size: clamp(40px, 8vw, 72px);
        color: #ffd700;
        margin-bottom: 15px;
        line-height: 1.1;
      }

      .store-title-row {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 15px;
      }

      .store-title-row h1 {
        margin-bottom: 0;
      }

      .job-title {
        margin: 12px 0;
        font-size: clamp(24px, 5vw, 38px);
        color: #fff;
      }

      .hero p {
        color: #ddd;
        line-height: 1.9;
        font-size: 17px;
      }

      .salary {
        margin-top: 28px;
        padding: 25px;
        border-radius: 22px;
        border: 1px solid rgba(255, 215, 0, 0.45);
        background: rgba(255, 215, 0, 0.08);
      }

      .salary small {
        display: block;
        color: #aaa;
        font-size: 14px;
      }

      .salary strong {
        display: block;
        font-size: 48px;
        margin-top: 10px;
        color: #ffd700;
      }

      .section {
        margin-top: 22px;
        padding: 25px;
        border-radius: 26px;
        border: 1px solid rgba(255, 215, 0, 0.28);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.07),
          rgba(255, 255, 255, 0.02)
        );
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }

      .section h2 {
        color: #ffd700;
        font-size: 28px;
        margin-bottom: 20px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 14px;
      }
      .info-card {
        padding: 18px;
        border-radius: 18px;
        border: 1px solid rgba(255, 215, 0, 0.18);
        background: rgba(255, 255, 255, 0.03);
      }

      .info-card span {
        display: block;
        font-size: 13px;
        color: #999;
        margin-bottom: 8px;
      }

      .info-card strong {
        font-size: 17px;
        font-weight: bold;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .gallery img {
        width: 100%;
        height: auto;
        max-height: min(70vh, 680px);
        object-fit: contain;
        border-radius: 18px;
        border: 1px solid rgba(255, 215, 0, 0.18);
        transition: 0.25s;
        cursor: pointer;
        background: #050505;
      }

      .general-job-badge {
        display: inline-flex;
        margin: 0 0 14px;
        padding: 7px 13px;
        border: 1px solid #72d6ff;
        border-radius: 999px;
        background: rgba(25, 137, 180, .18);
        color: #bcecff;
        font-weight: 800;
        letter-spacing: .04em;
      }

      .gallery-image-button {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 180px;
        padding: 0;
        border: 0;
        border-radius: 18px;
        background: #050505;
        cursor: zoom-in;
      }

      .gallery img:hover {
        transform: scale(1.02);
      }

      .pr {
        line-height: 2;
        color: #ddd;
        white-space: pre-wrap;
        text-align: left;
        overflow-wrap: anywhere;
        max-width: 900px;
      }

      .long-text {
        display: block;
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.9;
        font-weight: 600;
      }

      .info-card.full {
        grid-column: 1 / -1;
      }

      .apply-note {
        color: #bbb;
        line-height: 1.8;
        text-align: left;
      }
      .listing-source-badge{display:inline-flex;padding:5px 10px;border:1px solid rgba(212,175,55,.45);border-radius:999px;color:#e8cf76;background:rgba(212,175,55,.08);font-size:12px;font-weight:700}
      .public-info-notice{margin:16px 0;padding:16px;border:1px solid rgba(212,175,55,.32);border-radius:14px;background:#0b0b0b;color:#ddd;line-height:1.8}

      .apply-modal {
        width: min(92vw, 620px);
        max-height: 90vh;
        overflow: auto;
        padding: 0;
        border: 1px solid rgba(255, 215, 0, 0.45);
        border-radius: 24px;
        background: #0b0b0b;
        color: #fff;
      }

      .apply-modal::backdrop { background: rgba(0, 0, 0, 0.82); }
      .apply-modal-inner { padding: 26px; }
      .apply-modal label { display: block; margin-top: 14px; color: #ddd; text-align: left; }
      .apply-modal-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .apply-modal-close { min-width: 44px; min-height: 44px; border-radius: 50%; border: 1px solid #665722; background: #111; color: #fff; cursor: pointer; }
      .apply-confirm { padding: 18px; border: 1px solid rgba(255, 215, 0, .25); border-radius: 16px; background: #080808; }
      .apply-message { white-space: pre-wrap; text-align: left; overflow-wrap: anywhere; line-height: 1.8; }
      .apply-actions { display: grid; gap: 10px; margin-top: 16px; }
      .apply-status { min-height: 1.5em; color: #f5d36b; text-align: center; }

      .image-dialog {
        width: min(96vw, 1100px);
        max-height: 94vh;
        padding: 14px;
        border: 1px solid rgba(255, 215, 0, .45);
        border-radius: 20px;
        background: #050505;
      }
      .image-dialog::backdrop { background: rgba(0, 0, 0, .9); }
      .image-dialog img { display: block; width: 100%; height: auto; max-height: 86vh; object-fit: contain; }

      .apply-box {
        margin-top: 25px;
        padding: 25px;
        border-radius: 26px;
        border: 1px solid rgba(255, 215, 0, 0.35);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.07),
          rgba(255, 255, 255, 0.02)
        );
      }

      .apply-box h2 {
        color: #ffd700;
        margin-bottom: 18px;
      }

      .fallback-contact { margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.18); }
      .fallback-contact h3 { margin: 0 0 12px; color: #fff; font-size: 17px; }
      .fallback-contact-links { display: flex; flex-wrap: wrap; gap: 10px; }
      .fallback-contact-links a { color: #ffd700; overflow-wrap: anywhere; }

      .apply-box input,
      .apply-box textarea,
      .apply-modal input {
        width: 100%;
        padding: 15px;
        margin: 10px 0;
        background: #080808;
        border: 1px solid rgba(255, 215, 0, 0.25);
        border-radius: 14px;
        color: #fff;
        font-size: 16px;
      }

      .apply-box textarea {
        min-height: 120px;
        resize: vertical;
      }

      .line-btn {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        padding: 18px;
        margin-top: 15px;
        border-radius: 999px;
        background: #06c755;
        color: #fff;
        font-weight: bold;
        font-size: 18px;
        border: none;
        cursor: pointer;
        transition: 0.25s;
      }

      .line-btn:hover {
        transform: translateY(-2px);
      }

      .line-btn.is-disabled {
        opacity: 0.45;
        pointer-events: none;
      }

      .footer {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
        margin-top: 35px;
      }

      .loading {
        padding: 80px 20px;
        text-align: center;
        color: #ccc;
      }

      @media (max-width: 760px) {
        .hero {
          padding: 24px;
        }

        .hero h1 {
          font-size: 42px;
        }

        .salary strong {
          font-size: 38px;
        }

        .gallery { grid-template-columns: 1fr; }
        .gallery img { max-height: 72vh; }
        .apply-modal-inner { padding: 20px; }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <header class="header">
        <a href="../index.html" class="logo">
          NOX
          <small>Night Opens X</small>
        </a>

        <nav class="nav">
          <a href="./jobs.html" class="btn"> 求人一覧 </a>

          <a href="../index.html" class="btn"> TOP </a>

          <a href="./mypage.html" class="btn gold"> マイページ </a>
        </nav>
      </header>

      <div id="jobDetail" class="loading">求人情報を読み込み中です...</div>
      <script src="./job-fields.js"></script>
      <script src="./job-detail-media.js"></script>
      <script type="module">
        import { db } from "./firebase-db.js";
        import { auth } from "./firebase.js";
        import {
          doc,
          getDoc,
          setDoc,
          arrayUnion,
          arrayRemove,
          increment,
          serverTimestamp,
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import {
          getFunctions,
          httpsCallable,
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

        const params = new URLSearchParams(location.search);
        const id = params.get("id");
        const jobDetail = document.getElementById("jobDetail");
        const functions = getFunctions(auth.app, "asia-northeast1");
        const getPublicJobStoreMedia = httpsCallable(
          functions,
          "getPublicJobStoreMedia",
        );
        const getPublicStoreCustomerPage = httpsCallable(functions, "getPublicStoreCustomerPage");
        const trackStoreCustomerEvent = httpsCallable(functions, "trackStoreCustomerEvent");

        function escapeHtml(v) {
          return String(v).replace(/[&<>"']/g, (character) => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
          })[character]);
        }

        function value(v) {
          return v !== undefined && v !== null && String(v).trim()
            ? escapeHtml(String(v))
            : "未設定";
        }

        function safeExternalUrl(value) {
          if (typeof value !== "string" || !value.trim()) return "";
          try {
            const parsed = new URL(value.trim());
            return parsed.protocol === "https:" || parsed.protocol === "http:"
              ? parsed.href
              : "";
          } catch {
            return "";
          }
        }

        function safeContactEmail(value) {
          const email = typeof value === "string" ? value.trim().toLowerCase() : "";
          return /^[A-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Z0-9](?:[A-Z0-9-]{0,61}[A-Z0-9])?(?:\.[A-Z0-9](?:[A-Z0-9-]{0,61}[A-Z0-9])?)+$/i.test(email) ? email : "";
        }

        function contactPhoneNumbers(value) {
          if (typeof value !== "string") return [];
          return value.normalize("NFKC").split(/\s*(?:\/|・|,|，|、)\s*/).map((number) => number.trim()).filter((number) => {
            const digits = number.replace(/\D/g, "");
            return /^[+0-9()\-\s.]+$/.test(number) && digits.length >= 7 && digits.length <= 15;
          });
        }

        function getJapanDateKey() {
          const parts = new Intl.DateTimeFormat("ja-JP", {
            timeZone: "Asia/Tokyo",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
          }).formatToParts(new Date());

          const year = parts.find((item) => item.type === "year")?.value;
          const month = parts.find((item) => item.type === "month")?.value;
          const day = parts.find((item) => item.type === "day")?.value;

          return `${year}-${month}-${day}`;
        }

        async function recordJobView(jobData) {
          if (!id) return;

          const dateKey = getJapanDateKey();
          const storageKey = `nox_job_view_${id}_${dateKey}`;

          if (localStorage.getItem(storageKey)) return;

          const storeId =
            jobData.storeId || jobData.ownerId || jobData.userId || "";

          const storeName = jobData.storeName || jobData.name || "";

          try {
            await setDoc(
              doc(db, "jobViewStats", `${id}_${dateKey}`),
              {
                jobId: id,
                storeId,
                storeName,
                dateKey,
                count: increment(1),
                updatedAt: serverTimestamp(),
              },
              { merge: true },
            );

            if (storeId) {
              await setDoc(
                doc(db, "storeViewStats", `${storeId}_${dateKey}`),
                {
                  storeId,
                  storeName,
                  dateKey,
                  count: increment(1),
                  updatedAt: serverTimestamp(),
                },
                { merge: true },
              );
            }

            localStorage.setItem(storageKey, "viewed");
          } catch (error) {
            console.error("閲覧数の記録に失敗しました:", error);
          }
        }

        async function loadStoreMedia() {
          const empty = {
            logoUrl: "", coverImageUrl: "", profileImageUrl: "", galleryImages: [],
          };
          try {
            const response = await getPublicJobStoreMedia({ jobId: id });
            return response.data || empty;
          } catch (error) {
            console.warn("店舗画像の読み込みをスキップしました:", error?.code || "unknown");
            return empty;
          }
        }

        function renderJob(data, media) {
          const isPublicInfo = data.listingSource === "public_info";
          const job = window.NoxJobFields.normalize(data);
          const isGeneralOnly = window.NoxJobFields.normalizeBusinessScope(job.businessScope) === "general";
          const featureLabel = window.NoxJobFields.featureLabel;
          const contactPhones = contactPhoneNumbers(job.contactPhone);
          const contactEmail = safeContactEmail(job.contactEmail);
          const fallbackContact = contactPhones.length || contactEmail ? `
            <div class="fallback-contact">
              <h3>SNSが開けない場合のお問い合わせ先</h3>
              <div class="fallback-contact-links">
                ${contactPhones.map((phone) => `<a href="tel:${escapeHtml(phone.replace(/[^+0-9]/g, ""))}">${escapeHtml(phone)}</a>`).join("")}
                ${contactEmail ? `<a href="mailto:${escapeHtml(contactEmail)}">${escapeHtml(contactEmail)}</a>` : ""}
              </div>
            </div>` : "";
          const galleryUrls = Array.isArray(media?.galleryUrls)
            ? media.galleryUrls
            : [];
          const prImageUrls = Array.isArray(media?.prImageUrls)
            ? media.prImageUrls
            : [];
          const heroUrl = typeof media?.heroUrl === "string" ? media.heroUrl : "";
          const gallery = galleryUrls
            .map(
              (img) => `
                <button type="button" class="gallery-image-button" data-full-image="${escapeHtml(img)}" aria-label="店舗画像を拡大表示">
                  <img src="${escapeHtml(img)}" loading="lazy" alt="${value(job.storeName)} 店舗画像">
                </button>
              `,
            )
            .join("");
          const prGallery = prImageUrls
            .map((img) => `
              <button type="button" class="gallery-image-button" data-full-image="${escapeHtml(img)}" aria-label="求人PR画像を拡大表示">
                <img src="${escapeHtml(img)}" loading="lazy" alt="${value(job.storeName)} 求人PR画像">
              </button>
            `)
            .join("");

          const heroImage = heroUrl
            ? `
              <img
                src="${escapeHtml(heroUrl)}"
                alt="${value(job.storeName)}"
                data-full-image="${escapeHtml(heroUrl)}"
              >
            `
            : "";
          jobDetail.className = "";
          jobDetail.innerHTML = `
            <section class="hero">
              ${heroImage}

              <p class="kicker">NOX JOB DETAIL</p>

              ${isGeneralOnly ? '<p class="general-job-badge">一般・その他求人</p>' : ""}

              <div class="store-title-row">
                <h1>${value(job.storeName)}</h1>
              </div>

              <h2 class="job-title">${value(job.title)}</h2>

              <p>
                ${value(job.area)}
                ／
                ${value(job.businessType)}
              </p>

              <div class="salary">
                <small>給与</small>
                <strong>${value(job.salary)}</strong>
              </div>

              <div
                style="
                  margin-top:20px;
                  display:flex;
                  gap:12px;
                  flex-wrap:wrap;
                "
              >
                <button
                  id="saveJobBtn"
                  type="button"
                  class="btn"
                >
                  ♡ 求人を保存
                </button>
              </div>
            </section>

            ${
              prImageUrls.length
                ? `<section class="section"><h2>求人PR画像</h2><div class="gallery">${prGallery}</div></section>`
                : ""
            }

            ${
              galleryUrls.length
                ? `
                  <section class="section">
                    <h2>店舗写真</h2>
                    <div class="gallery">${gallery}</div>
                  </section>
                `
                : ""
            }

            <section class="section">
              <h2>基本情報</h2>

              <div class="grid">
                <div class="info-card">
                  <span>エリア</span>
                  <strong>${value(job.area)}</strong>
                </div>

                <div class="info-card">
                  <span>業種</span>
                  <strong>
                    ${value(job.businessType)}
                  </strong>
                </div>

                <div class="info-card">
                  <span>住所</span>
                  <strong>${value(job.address)}</strong>
                </div>

                <div class="info-card">
                  <span>最寄駅</span>
                  <strong>${value(job.station)}</strong>
                </div>

                <div class="info-card">
                  <span>営業時間</span>
                  <strong>${value(job.workHours)}</strong>
                </div>

                ${job.closedDay ? `
                  <div class="info-card">
                    <span>定休日</span>
                    <strong>${value(job.closedDay)}</strong>
                  </div>
                ` : ""}
              </div>
            </section>

            <section class="section">
              <h2>求人情報</h2>

              <div class="grid">
                ${isGeneralOnly ? "" : `<div class="info-card">
                  <span>各種バック</span>
                  <strong>${value(job.back)}</strong>
                </div>`}

                <div class="info-card">
                  <span>日払い</span>
                  <strong>${featureLabel(job.dailyPay)}</strong>
                </div>

                ${isGeneralOnly ? "" : `<div class="info-card">
                  <span>体験入店</span>
                  <strong>${featureLabel(job.trial, "体験入店あり")}</strong>
                </div>`}

                <div class="info-card">
                  <span>未経験歓迎</span>
                  <strong>${featureLabel(job.beginner, "未経験歓迎")}</strong>
                </div>

                <div class="info-card">
                  <span>採用年齢</span>
                  <strong>${value(job.age)}</strong>
                </div>

                <div class="info-card">
                  <span>シフト</span>
                  <strong>${value(job.shift)}</strong>
                </div>
              </div>
            </section>

            <section class="section">
              <h2>${isGeneralOnly ? "仕事内容・PR" : "店舗PR"}</h2>
              <div class="pr">
                ${value(job.description)}
              </div>
            </section>

            <section class="section">
              <h2>勤務・応募条件</h2>
              <div class="grid">
                <div class="info-card"><span>職種</span><strong>${value(job.position)}</strong></div>
                <div class="info-card"><span>勤務時間</span><strong>${value(job.workHours)}</strong></div>
                <div class="info-card full"><span>応募条件・資格</span><strong class="long-text">${value(job.requirements)}</strong></div>
                <div class="info-card full"><span>待遇・福利厚生</span><strong class="long-text">${value(job.benefits)}</strong></div>
                <div class="info-card"><span>対象性別</span><strong>${window.NoxJobFields.targetGenderLabel(job.targetGender)}</strong></div>
                <div class="info-card"><span>掲載区分</span><strong>${window.NoxJobFields.businessScopeLabel(job.businessScope)}</strong></div>
              </div>
            </section>

            <section class="apply-box">
              <h2>応募</h2>
              <p><span class="listing-source-badge">${window.NoxJobFields.listingSourceLabel(job.listingSource)}</span></p>
              ${isPublicInfo ? `<aside class="public-info-notice"><strong>公開情報確認済</strong><br>本ページは公開されている情報をもとにNOX運営が作成しています。店舗によるNOXへの掲載内容の確認・承認・提携を示すものではありません。募集状況や最新の条件については、お問い合わせ時にご確認ください。</aside>` : `<aside class="public-info-notice"><strong>NOX掲載店舗</strong><br>店舗様から直接提供・確認いただいた情報を掲載しています。</aside>`}
              <p class="apply-note">${isPublicInfo ? "この求人についてNOXへ相談できます。NOXが店舗から正式に指定された連絡先への応募ではありません。" : `応募内容をコピーした後、店舗指定の${window.NoxJobFields.applyTypeLabel(job.applyType)}へ移動します。NOXに氏名・電話番号は保存されません。`}</p>
              <button id="applyBtn" type="button" class="line-btn">${isPublicInfo ? "この求人について相談する" : "応募する"}</button>
              ${fallbackContact}
            </section>
            <section id="customerStoreLink" class="section" hidden></section>

            <dialog id="applyDialog" class="apply-modal">
              <div class="apply-modal-inner">
                <div class="apply-modal-header"><h2>応募情報</h2><button id="closeApplyDialog" type="button" class="apply-modal-close" aria-label="閉じる">×</button></div>
                <div id="applyEntryStep">
                  <label for="entryName">名前</label><input id="entryName" type="text" maxlength="80" autocomplete="name" required>
                  <label for="entryPhone">電話番号</label><input id="entryPhone" type="tel" maxlength="30" inputmode="tel" autocomplete="tel" required>
                  <button id="confirmApplication" type="button" class="line-btn">応募先を確認する</button>
                </div>
                <div id="applyConfirmStep" hidden>
                  <p>応募先：<strong>${value(job.storeName)}</strong></p>
                  <p>応募先SNS：<strong>${window.NoxJobFields.applyTypeLabel(job.applyType)}</strong></p>
                  <div id="applicationMessage" class="apply-confirm apply-message"></div>
                  <div class="apply-actions">
                    <button id="copyApplication" type="button" class="btn gold">応募内容をコピー</button>
                    <button id="copyName" type="button" class="btn">名前だけコピー</button>
                    <button id="copyPhone" type="button" class="btn">電話番号だけコピー</button>
                    <a id="openApplicationUrl" class="line-btn is-disabled" target="_blank" rel="noopener noreferrer" aria-disabled="true"></a>
                    <button id="backApplication" type="button" class="btn">入力へ戻る</button>
                  </div>
                  <p id="applyStatus" class="apply-status" role="status"></p>
                </div>
              </div>
            </dialog>

            <dialog id="imageDialog" class="image-dialog"><img id="fullImage" alt="拡大した店舗画像"></dialog>
          `;
        }

        async function copyText(text, statusElement) {
          try {
            if (navigator.clipboard?.writeText) {
              await navigator.clipboard.writeText(text);
            } else {
              const temporary = document.createElement("textarea");
              temporary.value = text;
              temporary.setAttribute("readonly", "");
              temporary.style.position = "fixed";
              temporary.style.opacity = "0";
              document.body.appendChild(temporary);
              temporary.select();
              if (!document.execCommand("copy")) throw new Error("copy-failed");
              temporary.remove();
            }
            statusElement.textContent = "コピーしました";
            return true;
          } catch {
            statusElement.textContent = "コピーできませんでした。文章を選択してコピーしてください。";
            return false;
          }
        }

        function setupImagePreview() {
          const dialog = document.getElementById("imageDialog");
          const fullImage = document.getElementById("fullImage");
          if (!dialog || !fullImage) return;
          document.querySelectorAll("[data-full-image]").forEach((element) => {
            element.addEventListener("click", () => {
              fullImage.src = element.dataset.fullImage || "";
              if (fullImage.src) dialog.showModal();
            });
          });
          dialog.addEventListener("click", (event) => {
            if (event.target === dialog) dialog.close();
          });
        }

        function setupApplication(data) {
          const job = window.NoxJobFields.normalize(data);
          const applyBtn = document.getElementById("applyBtn");
          const dialog = document.getElementById("applyDialog");
          const entryStep = document.getElementById("applyEntryStep");
          const confirmStep = document.getElementById("applyConfirmStep");
          const nameInput = document.getElementById("entryName");
          const phoneInput = document.getElementById("entryPhone");
          const status = document.getElementById("applyStatus");
          const applicationMessage = document.getElementById("applicationMessage");
          const destinationUrl = safeExternalUrl(job.applyUrl);
          const destinationLabel = window.NoxJobFields.applyTypeLabel(job.applyType);
          if (!applyBtn || !dialog) return;

          if (!destinationUrl) {
            applyBtn.disabled = true;
            applyBtn.textContent = "現在、この求人の応募先が設定されていません。";
            return;
          }

          const close = () => dialog.close();
          document.getElementById("closeApplyDialog").addEventListener("click", close);
          applyBtn.addEventListener("click", () => {
            entryStep.hidden = false;
            confirmStep.hidden = true;
            status.textContent = "";
            dialog.showModal();
            nameInput.focus();
          });

          document.getElementById("confirmApplication").addEventListener("click", () => {
            const name = nameInput.value.trim();
            const phone = phoneInput.value.trim();
            const phoneDigits = phone.replace(/\D/g, "");
            if (!name || name.length > 80) {
              nameInput.setCustomValidity("名前を入力してください。");
              nameInput.reportValidity();
              return;
            }
            nameInput.setCustomValidity("");
            if (phoneDigits.length < 7 || phoneDigits.length > 15 || !/^[+0-9()\-\s]+$/.test(phone)) {
              phoneInput.setCustomValidity("正しい電話番号を入力してください。");
              phoneInput.reportValidity();
              return;
            }
            phoneInput.setCustomValidity("");
            const message = `NOXを見て応募しました。\n名前：${name}\n電話番号：${phone}`;
            applicationMessage.textContent = message;
            entryStep.hidden = true;
            confirmStep.hidden = false;
            status.textContent = "";
            const openLink = document.getElementById("openApplicationUrl");
            openLink.textContent = `${destinationLabel}で応募する`;
            openLink.removeAttribute("href");
            openLink.classList.add("is-disabled");
            openLink.setAttribute("aria-disabled", "true");
            document.getElementById("copyApplication").onclick = async () => {
              if (await copyText(message, status)) {
                openLink.href = destinationUrl;
                openLink.classList.remove("is-disabled");
                openLink.removeAttribute("aria-disabled");
              }
            };
            document.getElementById("copyName").onclick = () => copyText(name, status);
            document.getElementById("copyPhone").onclick = () => copyText(phone, status);
          });

          document.getElementById("backApplication").addEventListener("click", () => {
            confirmStep.hidden = true;
            entryStep.hidden = false;
            status.textContent = "";
          });
          dialog.addEventListener("click", (event) => {
            if (event.target === dialog) close();
          });
        }

        async function setupSaveButton() {
          const saveBtn = document.getElementById("saveJobBtn");
          if (!saveBtn) return;

          const user = auth.currentUser;

          if (user) {
            const userSnap = await getDoc(doc(db, "users", user.uid));

            const savedJobIds =
              userSnap.exists() && Array.isArray(userSnap.data().savedJobIds)
                ? userSnap.data().savedJobIds
                : [];

            if (savedJobIds.includes(id)) {
              saveBtn.textContent = "♥ 保存済み";
              saveBtn.classList.add("gold");
            }
          }

          saveBtn.addEventListener("click", async () => {
            const currentUser = auth.currentUser;

            if (!currentUser) {
              alert("求人を保存するにはログインが必要です。");
              location.href = "./login.html";
              return;
            }

            saveBtn.disabled = true;

            try {
              const userRef = doc(db, "users", currentUser.uid);
              const userSnap = await getDoc(userRef);

              const savedJobIds =
                userSnap.exists() && Array.isArray(userSnap.data().savedJobIds)
                  ? userSnap.data().savedJobIds
                  : [];

              const isSaved = savedJobIds.includes(id);

              await setDoc(
                userRef,
                {
                  savedJobIds: isSaved ? arrayRemove(id) : arrayUnion(id),
                  updatedAt: serverTimestamp(),
                },
                { merge: true },
              );

              if (isSaved) {
                saveBtn.textContent = "♡ 求人を保存";
                saveBtn.classList.remove("gold");
                alert("保存を解除しました。");
              } else {
                saveBtn.textContent = "♥ 保存済み";
                saveBtn.classList.add("gold");
                alert("求人を保存しました。");
              }
            } catch (error) {
              console.error("求人保存エラー:", error);
              alert("求人の保存に失敗しました。");
            } finally {
              saveBtn.disabled = false;
            }
          });
        }

        async function setupCustomerStoreLink(data) {
          const storeId = data.storeId || data.ownerId || "";
          const container = document.getElementById("customerStoreLink");
          if (!storeId || !container) return;
          try {
            await getPublicStoreCustomerPage({ storeId });
            container.hidden = false;
            container.innerHTML = `<h2>このお店に遊びに行く</h2><p>店舗情報・料金・予約はこちら</p><a id="customerStoreButton" class="line-btn" href="./store-detail.html?id=${encodeURIComponent(storeId)}">お客様向け店舗ページを見る</a>`;
            document.getElementById("customerStoreButton")?.addEventListener("click", () => {
              trackStoreCustomerEvent({ storeId, eventType: "job_to_store", eventId: crypto.randomUUID?.() || `${Date.now()}_${Math.random()}` }).catch(() => {});
            });
          } catch { container.hidden = true; }
        }

        async function loadJob() {
          if (!id) {
            jobDetail.innerHTML = `
              <div class="section">
                <h2>求人が見つかりません</h2>
              </div>
            `;
            return;
          }

          try {
            const snap = await getDoc(doc(db, "jobs", id));
            if (!snap.exists()) {
              jobDetail.innerHTML = `
                <div class="section">
                  <h2>求人情報がありません</h2>
                </div>
              `;
              return;
            }

            const data = snap.data();
            if (
              data.status !== "approved" ||
              data.isPublic !== true ||
              data.contractListingStatus !== "active"
            ) {
              jobDetail.innerHTML = `
                <div class="section">
                  <h2>現在この求人は掲載されていません</h2>
                </div>
              `;
              return;
            }

            const storeMedia = await loadStoreMedia();

            try {
              await recordJobView(data);
            } catch (error) {
              console.warn("閲覧数の記録をスキップしました:", error);
            }

            const media = window.NoxJobDetailMedia.compose(
              data,
              storeMedia,
              "../images/7240C21C-E2E7-47E1-9F48-6ECC3468406D.png",
            );

            renderJob(data, media);
            setupImagePreview();
            setupApplication(data);
            await setupCustomerStoreLink(data);
            await setupSaveButton();
          } catch (error) {
            console.error("求人読み込みエラー:", error);

            jobDetail.innerHTML = `
              <div class="section">
                <h2>読み込みに失敗しました</h2>
                <p>時間を空けて再度お試しください。</p>
              </div>
            `;
          }
        }

        loadJob();
      </script>

      <div class="footer">
        <a href="./jobs.html" class="btn"> 求人一覧へ戻る </a>

        <a href="../index.html" class="btn gold"> TOPへ戻る </a>
      </div>
    </div>
    <script type="module" src="../analytics.js"></script>
  </body>
</html>
