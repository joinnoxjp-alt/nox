<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ご注文｜NOX BEAUTY</title><meta name="description" content="NOX BEAUTY公式パートナーブランド商品のご注文フォーム"><meta name="robots" content="noindex"><link rel="stylesheet" href="beauty.css"><link rel="stylesheet" href="beauty-polish.css"></head><body>
<header class="beauty-header"><a class="beauty-logo" href="beauty.html">NOX <small>BEAUTY</small></a><nav class="beauty-nav"><a href="beauty-mireio.html">商品に戻る</a></nav></header>
<main class="order-shell"><div class="order-intro"><span class="eyebrow">ORDER</span><h1 class="beauty-heading">ご注文内容</h1><span class="partner-badge">NOX公式パートナーブランド商品</span></div><div class="notice payment-info"><b>ⓘ お支払いについて</b><br>お支払いは銀行振込です。NOXは個人事業として運営しているため、振込先はNOX運営者本人名義です。送料は地域により異なり、注文受付後に確定してご案内します。</div>
<form data-order-form><div class="form-grid"><div class="form-field full"><label>注文商品<select name="productId" required></select></label></div><div class="form-field"><label>数量<input name="quantity" type="number" min="1" max="10" value="1" required></label></div><div class="form-field"><label>氏名<input name="customerName" autocomplete="name" maxlength="80" required></label></div><div class="form-field"><label>フリガナ<input name="customerKana" maxlength="100" required></label></div><div class="form-field"><label>郵便番号<input name="postalCode" inputmode="numeric" autocomplete="postal-code" placeholder="000-0000" required></label></div><div class="form-field full"><label>住所<input name="address" autocomplete="street-address" maxlength="200" required></label></div><div class="form-field"><label>電話番号<input name="phone" type="tel" autocomplete="tel" required></label></div><div class="form-field"><label>メールアドレス<input name="email" type="email" autocomplete="email" required></label></div><div class="form-field full"><label>備考<textarea name="note" maxlength="1000"></textarea></label></div><div class="form-field full" aria-hidden="true" style="position:absolute;left:-9999px"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div></div><div class="order-summary" data-summary></div><label><input type="checkbox" name="agreed" required> <a href="terms.html" target="_blank">利用規約</a>・<a href="privacy.html" target="_blank">プライバシーポリシー</a>に同意します</label><div class="button-row"><button class="beauty-button" type="button" data-confirm>注文内容を確認</button><button class="beauty-button" type="submit" data-submit hidden>注文を確定</button><button class="beauty-button secondary" type="button" data-edit hidden>修正する</button></div><p class="status" role="status" data-status></p></form></main>
<footer class="beauty-footer">© NOX BEAUTY</footer><script type="module" src="beauty-order.js"></script></body></html>
