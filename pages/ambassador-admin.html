<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公式アンバサダー管理 | NOX</title><link rel="stylesheet" href="ambassadors.css"><style>.admin-grid{display:grid;grid-template-columns:340px 1fr;gap:24px}.admin-list{display:grid;gap:10px;margin-top:15px}.admin-row{padding:14px;border:1px solid var(--line);border-radius:14px;background:#111}.admin-row strong{color:var(--gold2)}.admin-actions{display:flex;gap:7px;margin-top:8px}.admin-actions .amb-btn{min-height:36px;padding:5px 12px}.admin-images{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}.admin-images img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.admin-help{color:#aaa;font-size:12px}@media(max-width:820px){.admin-grid{grid-template-columns:1fr}.amb-form{padding:18px}}</style></head><body><main class="amb-shell"><header class="amb-head"><a class="amb-logo" href="../index.html">NOX ADMIN</a><nav class="amb-nav"><a class="amb-btn" href="admin.html">管理者ページ</a><a class="amb-btn gold" href="ambassadors.html" target="_blank">公開ページ</a></nav></header><h1 class="amb-title">公式アンバサダー管理</h1><p class="amb-lead" id="authStatus">管理者権限を確認しています…</p><section class="admin-grid" id="adminApp" hidden><aside><button class="amb-btn gold" id="newButton" type="button">＋ 新規登録</button><div class="admin-list" id="adminList"></div></aside><form class="amb-form" id="adminForm"><input type="hidden" name="id"><div class="amb-fields"><div class="amb-field"><label>活動名 *</label><input name="name" required maxlength="80"></div><div class="amb-field"><label>表示順</label><input name="displayOrder" type="number" min="1" value="1"></div><div class="amb-field full"><label>一言紹介</label><input name="tagline" maxlength="180"></div><div class="amb-field full"><label>プロフィール</label><textarea name="profile" maxlength="3000"></textarea></div><div class="amb-field"><label>活動エリア</label><input name="area" maxlength="150"></div><div class="amb-field"><label>フォロワー数</label><input name="followers" maxlength="100"></div><div class="amb-field full"><label>得意ジャンル（1行に1件）</label><textarea name="genres"></textarea></div><div class="amb-field full"><label>対応可能案件（1行に1件）</label><textarea name="services"></textarea></div><div class="amb-field"><label>Instagram URL</label><input name="instagram" type="url"></div><div class="amb-field"><label>TikTok URL</label><input name="tiktok" type="url"></div><div class="amb-field"><label>その他SNS URL</label><input name="otherSns" type="url"></div><div class="amb-field full"><label>NOXおすすめコメント</label><textarea name="recommendation"></textarea></div><div class="amb-field full"><label>対応可否</label><div class="amb-checks"><label><input type="checkbox" name="capabilities" value="PR投稿"> PR投稿</label><label><input type="checkbox" name="capabilities" value="TikTok動画"> TikTok動画</label><label><input type="checkbox" name="capabilities" value="Instagram投稿"> Instagram投稿</label><label><input type="checkbox" name="capabilities" value="ストーリー投稿"> ストーリー投稿</label><label><input type="checkbox" name="capabilities" value="LIVE配信"> LIVE配信</label><label><input type="checkbox" name="capabilities" value="撮影モデル"> 撮影モデル</label></div></div><div class="amb-field"><label>メイン写真（5MB以下）</label><input name="mainImage" type="file" accept="image/jpeg,image/png,image/webp"><span class="admin-help">未選択なら現在の写真を保持</span></div><div class="amb-field"><label>追加写真（最大9枚）</label><input name="galleryImages" type="file" accept="image/jpeg,image/png,image/webp" multiple></div><div class="amb-field full"><div class="admin-images" id="currentImages"></div></div><div class="amb-field full"><label>料金項目（1行1件）</label><textarea name="prices" placeholder="Instagram投稿：10,000円〜"></textarea></div><div class="amb-field full"><label><input type="checkbox" name="priceVisible"> 料金を公開</label>　<label><input type="checkbox" name="visible" checked> 公開</label>　<label><input type="checkbox" name="featured"> おすすめ</label>　<label><input type="checkbox" name="isNew"> NEW</label></div><div class="amb-field full"><button class="amb-btn gold" type="submit">保存する</button><p class="amb-status" id="adminStatus"></p></div></div></form></section></main><script type="module" src="ambassador-admin.js"></script></body></html>
