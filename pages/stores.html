<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遊びに行ける店舗 | NOX</title><link rel="stylesheet" href="./store-customer.css"></head><body class="store-customer"><main class="store-shell"><nav class="store-nav"><a href="../index.html">NOX</a><a href="./jobs.html">求人を探す</a></nav><header><span class="store-badge">FOR CUSTOMERS</span><h1>遊びに行ける店舗</h1><p>店舗情報・料金・NOX限定特典・予約方法を確認できます。</p></header><div id="stores" class="store-list">読み込み中…</div></main><script type="module">import{auth}from'./firebase.js';import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const el=document.getElementById('stores');httpsCallable(getFunctions(auth.app,'asia-northeast1'),'getPublicCustomerStores')({}).then(r=>{const stores=r.data.stores||[];el.innerHTML=stores.length?stores.map(s=>`<a class="store-card" href="./store-detail.html?id=${encodeURIComponent(s.storeId)}">${s.coverImageUrl?`<img src="${esc(s.coverImageUrl)}" alt="">`:''}<span class="store-badge">${esc(s.category||'店舗')}</span><h2>${esc(s.storeName)}</h2><p>${esc(s.address)}</p></a>`).join(''):'<p>現在公開中の店舗はありません。</p>'}).catch(()=>el.textContent='店舗情報を取得できませんでした。');</script></body></html>
