<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>求人・店舗管理 | NOX</title>

  <link rel="stylesheet" href="../style.css">

  <style>
    .job-admin-wrap{
      width:100%;
      max-width:1000px;
      margin:0 auto;
    }

    .admin-section{
      margin-top:36px;
      padding-top:28px;
      border-top:1px solid rgba(201,163,74,.3);
    }

    .admin-section-title{
      margin-bottom:8px;
      color:#f5d36b;
      font-size:25px;
    }

    .admin-section-text{
      margin-bottom:20px;
      color:#aaa;
      line-height:1.7;
    }

    .job-admin-card{
      margin:18px 0;
      padding:20px;
      color:#fff;
      background:#111;
      border:1px solid rgba(201,163,74,.5);
      border-radius:18px;
    }

    .job-admin-card h3{
      margin:0 0 12px;
      color:#f5d36b;
      font-size:22px;
    }

    .job-admin-card p{
      margin:7px 0;
      color:#ddd;
      line-height:1.7;
      overflow-wrap:anywhere;
    }

    .job-preview-image{
      display:block;
      width:100%;
      max-height:340px;
      margin-bottom:16px;
      object-fit:cover;
      border:1px solid rgba(212,175,55,.3);
      border-radius:14px;
      background:#080808;
    }

    .status-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:12px;
    }

    .status-badge{
      display:inline-block;
      padding:5px 10px;
      border-radius:999px;
      font-size:13px;
      font-weight:bold;
    }

    .status-pending{
      color:#ffe59a;
      background:rgba(212,175,55,.15);
      border:1px solid rgba(212,175,55,.4);
    }

    .status-approved{
      color:#caffd0;
      background:rgba(46,160,67,.16);
      border:1px solid rgba(46,160,67,.45);
    }

    .status-paused{
      color:#ddd;
      background:rgba(150,150,150,.15);
      border:1px solid rgba(150,150,150,.4);
    }

    .status-top-on{
      color:#ffeaa5;
      background:rgba(212,175,55,.18);
      border:1px solid rgba(212,175,55,.55);
    }

    .status-top-off{
      color:#bbb;
      background:rgba(100,100,100,.13);
      border:1px solid rgba(130,130,130,.35);
    }

    .image-upload{
      width:100%;
      margin:14px 0;
      padding:12px;
      color:#fff;
      background:#080808;
      border:1px solid #333;
      border-radius:12px;
    }

    .admin-button-group{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin-top:16px;
    }

    .admin-action-button{
      width:100%;
      padding:13px 14px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-size:15px;
      font-weight:bold;
      transition:.25s;
    }

    .admin-action-button:hover{
      transform:translateY(-2px);
      filter:brightness(1.08);
    }

    .approve-button,
    .publish-button,
    .top-on-button,
    .edit-button,
    .save-button{
      color:#000;
      background:linear-gradient(
        135deg,
        #f5d36b,
        #b98a19
      );
    }

    .pause-button{
      color:#fff;
      background:#555;
    }

    .top-off-button,
    .cancel-button{
      color:#fff;
      background:#745d20;
    }

    .delete-button{
      color:#fff;
      background:#a52222;
    }

    .admin-action-button:disabled{
      opacity:.5;
      cursor:not-allowed;
      transform:none;
    }

    .empty-message{
      margin:16px 0;
      padding:18px;
      color:#aaa;
      text-align:center;
      background:#111;
      border:1px solid #292929;
      border-radius:14px;
    }

    .loading-message{
      padding:18px;
      color:#aaa;
      text-align:center;
    }

    /* 編集フォーム */

    .job-edit-form{
      display:none;
      margin-top:20px;
      padding-top:20px;
      border-top:1px solid rgba(212,175,55,.25);
    }

    .job-edit-form.open{
      display:block;
    }

    .edit-form-title{
      margin-bottom:18px;
      color:#f5d36b;
      font-size:20px;
    }

    .edit-form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .edit-form-group{
      display:flex;
      flex-direction:column;
      gap:8px;
      min-width:0;
    }

    .edit-form-group.full{
      grid-column:1 / -1;
    }

    .edit-form-group label{
      color:#f5d36b;
      font-size:13px;
      font-weight:bold;
    }

    .edit-form-group input,
    .edit-form-group select,
    .edit-form-group textarea{
      width:100%;
      min-width:0;
      padding:13px;
      color:#fff;
      background:#090909;
      border:1px solid rgba(212,175,55,.3);
      border-radius:11px;
      outline:none;
      font-size:15px;
    }

    .edit-form-group input:focus,
    .edit-form-group select:focus,
    .edit-form-group textarea:focus{
      border-color:#d4af37;
      box-shadow:0 0 18px rgba(212,175,55,.18);
    }

    .edit-form-group textarea{
      min-height:110px;
      resize:vertical;
      line-height:1.7;
    }

    .edit-image-preview{
      display:none;
      width:100%;
      max-height:320px;
      margin-top:10px;
      object-fit:cover;
      border-radius:13px;
      border:1px solid rgba(212,175,55,.3);
    }

    .edit-image-preview.show{
      display:block;
    }

    .edit-save-status{
      min-height:22px;
      margin-top:12px;
      text-align:center;
      color:#aaa;
      font-size:13px;
    }

    .edit-save-status.success{
      color:#9fffb0;
    }

    .edit-save-status.error{
      color:#ff9b9b;
    }

    @media(min-width:600px){
      .admin-button-group{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:650px){
      .edit-form-grid{
        grid-template-columns:1fr;
      }

      .edit-form-group.full{
        grid-column:auto;
      }

      .job-admin-card{
        padding:17px;
      }
    }
  </style>
</head>

<body class="register-body">

  <main class="register-page">

    <section class="register-section">

      <div class="register-card job-admin-wrap">

        <div class="register-step">
          <span>NOX JOB ADMIN</span>
          <h2>求人・店舗管理</h2>
          <p>店舗掲載申請・掲載中求人の編集と管理</p>
        </div>

        <!-- 承認待ち -->
        <section class="admin-section">

          <h3 class="admin-section-title">
            承認待ち申請
          </h3>

          <p class="admin-section-text">
            店舗から届いた掲載申請を確認して公開できます。
          </p>

          <div id="pendingJobList">
            <p class="loading-message">
              読み込み中...
            </p>
          </div>

        </section>

        <!-- 登録済み店舗 -->
        <section class="admin-section">

          <h3 class="admin-section-title">
            登録済み店舗一覧
          </h3>

          <p class="admin-section-text">
            店舗UIDとownerIdを基準に登録済み店舗を表示します。求人が0件でも表示されます。
          </p>

          <div id="registeredStoreList">
            <p class="loading-message">
              読み込み中...
            </p>
          </div>

        </section>

        <!-- 求人一覧 -->
        <section class="admin-section">

          <h3 class="admin-section-title">
            公開求人一覧
          </h3>

          <p class="admin-section-text">
            公開中の求人をownerId基準で表示します。
          </p>

          <div id="publishedJobList">
            <p class="loading-message">
              読み込み中...
            </p>
          </div>

        </section>

        <div class="header-actions">

          <a
            href="../index.html"
            class="btn ghost"
          >
            トップへ戻る
          </a>

          <a
            href="./admin.html"
            class="btn ghost"
          >
            管理者ページ
          </a>

        </div>

      </div>

    </section>

  </main>

  <script src="./job-fields.js"></script>
  <script type="module">

    import { auth } from "../firebase.js";

    import {
      requireActiveAdmin
    } from "./admin-authorization.js";

    import {
      getFirestore,
      collection,
      getDocs,
      getDoc,
      doc,
      deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    import {
      getFunctions,
      httpsCallable
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

    import {
      getStorage,
      ref,
      uploadBytes,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

    const db = getFirestore();
    const storage = getStorage();
    const functions = getFunctions(
      auth.app,
      "asia-northeast1"
    );
    const approveJobApplicationCallable =
      httpsCallable(
        functions,
        "approveJobApplication"
      );
    const manageAdminJobCallable =
      httpsCallable(
        functions,
        "manageAdminJob"
      );

    const pendingJobList =
      document.getElementById("pendingJobList");

    const publishedJobList =
      document.getElementById("publishedJobList");

    const registeredStoreList =
      document.getElementById("registeredStoreList");

    let currentAdminUser = null;

    document.body.style.visibility =
      "hidden";

    /* =========================
       共通関数
    ========================= */

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function getTimestampSeconds(value){
      return value?.seconds || 0;
    }

    function getJobName(data){
      return window.NoxJobFields.normalize(data).storeName || "店舗名未設定";
    }

    function getJobArea(data){
      return window.NoxJobFields.normalize(data).area || "-";
    }

    function getJobSalary(data){
      return window.NoxJobFields.normalize(data).salary || "-";
    }

    function getJobImage(data){
      if(data.mainImage) return data.mainImage;
      if(data.imageUrl) return data.imageUrl;
      if(data.image) return data.image;
      if(data.storeImage) return data.storeImage;
      if(data.logoUrl) return data.logoUrl;

      if(
        Array.isArray(data.images) &&
        data.images.length > 0
      ){
        return data.images.find(Boolean) || "";
      }

      return "";
    }

    function getJobDescription(data){
      return window.NoxJobFields.normalize(data).description;
    }

    function getStatusLabel(status){
      if(status === "approved"){
        return "掲載中";
      }

      if(status === "paused"){
        return "掲載停止中";
      }

      return status || "不明";
    }

    function getStatusClass(status){
      if(status === "approved"){
        return "status-approved";
      }

      if(status === "paused"){
        return "status-paused";
      }

      return "status-pending";
    }

    function validateUrl(value){
      if(!value){
        return true;
      }

      try{
        const parsedUrl = new URL(value);

        return (
          parsedUrl.protocol === "https:" ||
          parsedUrl.protocol === "http:"
        );
      }catch{
        return false;
      }
    }

    /* =========================
       管理者確認
    ========================= */

    async function initializeJobAdmin() {
      const user =
        await requireActiveAdmin({
          auth,
          db,
          loginUrl:
            "./login.html?reason=admin-required"
        });

      if (!user) {
        return;
      }

      currentAdminUser = user;
      document.body.style.visibility =
        "visible";

      await loadAllJobs();
    }

    initializeJobAdmin();

    async function loadAllJobs(){
      await Promise.all([
        loadPendingJobs(),
        loadRegisteredStores(),
        loadPublishedJobs()
      ]);
    }

    async function loadRegisteredStores(){
      registeredStoreList.innerHTML = `
        <p class="loading-message">読み込み中...</p>
      `;

      try{
        const snapshot = await getDocs(
          collection(db,"stores")
        );
        const stores = snapshot.docs.map(
          storeDocument => ({
            id:storeDocument.id,
            ...storeDocument.data()
          })
        );

        if(stores.length === 0){
          registeredStoreList.innerHTML = `
            <p class="empty-message">登録済み店舗はありません。</p>
          `;
          return;
        }

        registeredStoreList.innerHTML = "";
        stores
          .sort((left,right) =>
            String(left.storeName || "").localeCompare(
              String(right.storeName || ""),
              "ja"
            )
          )
          .forEach(store => {
            const card = document.createElement("article");
            card.className = "job-admin-card";
            card.innerHTML = `
              <h3>${escapeHtml(store.storeName || "店舗名未設定")}</h3>
              <p>店舗UID：${escapeHtml(store.id)}</p>
              <p>ownerId：${escapeHtml(store.ownerId || "-")}</p>
              <p>掲載区分：${escapeHtml(store.businessScope || "-")}</p>
              <p>掲載状態：${escapeHtml(
                store.isPublic === true
                  ? "公開"
                  : "非公開"
              )}</p>
              <p>契約状態：${escapeHtml(
                store.contractListingStatus || "契約未設定"
              )}</p>
            `;
            registeredStoreList.appendChild(card);
          });
      }catch(error){
        console.error("登録済み店舗取得エラー",error);
        registeredStoreList.innerHTML = `
          <p class="empty-message">登録済み店舗を読み込めませんでした。</p>
        `;
      }
    }

    /* =========================
       承認待ち申請
    ========================= */

    function isJobApprovalComplete(
      application,
      job
    ){
      return (
        application.status === "approved" &&
        job?.status === "approved" &&
        job?.isPublic === true &&
        job?.contractListingStatus === "active"
      );
    }

    async function loadPendingJobs(){

      pendingJobList.innerHTML = `
        <p class="loading-message">
          読み込み中...
        </p>
      `;

      try{
        const snapshot =
          await getDocs(
            collection(db,"jobApplications")
          );

        const applications =
          await Promise.all(
            snapshot.docs.map(
              async (applicationDocument) => {
                const data =
                  applicationDocument.data();
                const jobId =
                  typeof data.jobId === "string" &&
                  data.jobId
                    ? data.jobId
                    : applicationDocument.id;
                const jobSnapshot =
                  await getDoc(
                    doc(db,"jobs",jobId)
                  );
                const job =
                  jobSnapshot.exists()
                    ? jobSnapshot.data()
                    : null;

                return {
                  id:applicationDocument.id,
                  ...data,
                  approvalComplete:
                    isJobApprovalComplete(
                      data,
                      job
                    )
                };
              }
            )
          );

        const pendingApplications =
          applications.filter(
            (application) =>
              !application.approvalComplete
          );

        pendingApplications.sort(
          (applicationA,applicationB) => {

            return (
              getTimestampSeconds(
                applicationB.createdAt
              ) -
              getTimestampSeconds(
                applicationA.createdAt
              )
            );
          }
        );

        if(pendingApplications.length === 0){

          pendingJobList.innerHTML = `
            <p class="empty-message">
              承認待ちの掲載申請はありません。
            </p>
          `;

          return;
        }

        pendingJobList.innerHTML = "";

        pendingApplications.forEach(
          (application) => {
            const needsReapproval =
              application.status === "approved";

            const card =
              document.createElement("article");

            card.className =
              "job-admin-card";

            card.innerHTML = `
              <h3>
                ${escapeHtml(
                  getJobName(application)
                )}
              </h3>

              <p>
                業種：
                ${escapeHtml(
                  application.businessType ||
                  application.jobType ||
                  "-"
                )}
              </p>

              <p>
                エリア：
                ${escapeHtml(
                  getJobArea(application)
                )}
              </p>

              <p>
                給与：
                ${escapeHtml(
                  getJobSalary(application)
                )}
              </p>

              <div class="status-row">

                <span class="status-badge status-pending">
                  ${
                    needsReapproval
                      ? "承認処理未完了・再承認が必要"
                      : "承認待ち"
                  }
                </span>

              </div>

              <input
                type="file"
                class="image-upload"
                accept="image/jpeg,image/png,image/webp"
                data-application-id="${escapeHtml(
                  application.id
                )}"
              >

              <div class="admin-button-group">

                <button
                  type="button"
                  class="admin-action-button approve-button approve-application-button"
                  data-application-id="${escapeHtml(
                    application.id
                  )}"
                >
                  ${
                    needsReapproval
                      ? "再承認して公開"
                      : "承認して公開"
                  }
                </button>

                <button
                  type="button"
                  class="admin-action-button delete-button delete-application-button"
                  data-application-id="${escapeHtml(
                    application.id
                  )}"
                >
                  申請を削除
                </button>

              </div>
            `;

            pendingJobList.appendChild(card);
          }
        );

      }catch(error){

        console.error(
          "申請一覧取得エラー:",
          error
        );

        pendingJobList.innerHTML = `
          <p class="empty-message">
            申請一覧を読み込めませんでした。
          </p>
        `;
      }
    }

    /* =========================
       求人一覧
    ========================= */

    async function loadPublishedJobs(){

      publishedJobList.innerHTML = `
        <p class="loading-message">
          読み込み中...
        </p>
      `;

      try{
        const snapshot =
          await getDocs(
            collection(db,"jobs")
          );

        const jobs = [];

        snapshot.forEach(
          (jobDocument) => {

            const data =
              jobDocument.data();

            if(
              data.status === "approved" &&
              data.isPublic === true &&
              data.contractListingStatus === "active"
            ){
              jobs.push({
                id:jobDocument.id,
                ...data
              });
            }
          }
        );

        jobs.sort(
          (jobA,jobB) => {

            const timeA =
              getTimestampSeconds(
                jobA.approvedAt
              ) ||
              getTimestampSeconds(
                jobA.createdAt
              );

            const timeB =
              getTimestampSeconds(
                jobB.approvedAt
              ) ||
              getTimestampSeconds(
                jobB.createdAt
              );

            return timeB - timeA;
          }
        );

        if(jobs.length === 0){

          publishedJobList.innerHTML = `
            <p class="empty-message">
              公開中の求人はありません。
            </p>
          `;

          return;
        }

        publishedJobList.innerHTML = "";

        jobs.forEach(
          (job) => {

            publishedJobList.appendChild(
              createPublishedJobCard(job)
            );
          }
        );

      }catch(error){

        console.error(
          "掲載求人取得エラー:",
          error
        );

        publishedJobList.innerHTML = `
          <p class="empty-message">
            公開中求人一覧を読み込めませんでした。
          </p>
        `;
      }
    }

    function createPublishedJobCard(job){

      const card =
        document.createElement("article");

      card.className =
        "job-admin-card";

      card.dataset.jobId =
        job.id;

      const isApproved =
        job.status === "approved";

      const isTopFeatured =
        job.topFeatured === true;

      const imageUrl =
        getJobImage(job);

      const description =
        getJobDescription(job);

      card.innerHTML = `

        ${
          imageUrl
            ? `
              <img
                src="${escapeHtml(imageUrl)}"
                alt="${escapeHtml(getJobName(job))}"
                class="job-preview-image"
              >
            `
            : ""
        }

        <h3>
          ${escapeHtml(getJobName(job))}
        </h3>

        <p>
          業種：
          ${escapeHtml(
            job.businessType ||
            job.jobType ||
            "-"
          )}
        </p>

        <p>
          エリア：
          ${escapeHtml(getJobArea(job))}
        </p>

        <p>
          給与：
          ${escapeHtml(getJobSalary(job))}
        </p>

        <div class="status-row">

          <span
            class="status-badge ${getStatusClass(
              job.status
            )}"
          >
            ${escapeHtml(
              getStatusLabel(job.status)
            )}
          </span>

          <span
            class="status-badge ${
              isTopFeatured
                ? "status-top-on"
                : "status-top-off"
            }"
          >
            ${
              isTopFeatured
                ? "トップ掲載中"
                : "トップ掲載OFF"
            }
          </span>

        </div>

        <div class="admin-button-group">

          <button
            type="button"
            class="admin-action-button edit-button edit-job-button"
            data-job-id="${escapeHtml(job.id)}"
          >
            ✏️ 店舗情報を編集
          </button>

          ${
            isApproved
              ? `
                <button
                  type="button"
                  class="admin-action-button pause-button pause-job-button"
                  data-job-id="${escapeHtml(job.id)}"
                >
                  掲載を停止
                </button>
              `
              : `
                <button
                  type="button"
                  class="admin-action-button publish-button republish-job-button"
                  data-job-id="${escapeHtml(job.id)}"
                >
                  再掲載する
                </button>
              `
          }

          ${
            isTopFeatured
              ? `
                <button
                  type="button"
                  class="admin-action-button top-off-button"
                  data-job-id="${escapeHtml(job.id)}"
                >
                  トップ掲載OFF
                </button>
              `
              : `
                <button
                  type="button"
                  class="admin-action-button top-on-button"
                  data-job-id="${escapeHtml(job.id)}"
                >
                  トップ掲載ON
                </button>
              `
          }

          <button
            type="button"
            class="admin-action-button pause-button end-job-button"
            data-job-id="${escapeHtml(job.id)}"
          >
            掲載終了
          </button>

          <button
            type="button"
            class="admin-action-button delete-button delete-job-button"
            data-job-id="${escapeHtml(job.id)}"
          >
            完全削除
          </button>

        </div>

        <!-- 編集フォーム -->
        <div
          class="job-edit-form"
          id="editForm-${escapeHtml(job.id)}"
        >

          <h4 class="edit-form-title">

    /* =========================
       クリック処理
    ========================= */

    document.addEventListener(
      "click",
      async (event) => {

        const target = event.target;

        if(
          target.classList.contains(
            "approve-application-button"
          )
        ){
          await approveApplicationWithCallable(
            target
          );
          return;
        }

        if(
          target.classList.contains(
            "delete-application-button"
          )
        ){
          await deleteApplication(target);
          return;
        }

        if(
          target.classList.contains(
            "edit-job-button"
          )
        ){
          openEditForm(target.dataset.jobId);
          return;
        }

        if(
          target.classList.contains(
            "cancel-edit-button"
          )
        ){
          closeEditForm(target.dataset.jobId);
          return;
        }

        if(
          target.classList.contains(
            "save-job-button"
          )
        ){
          await saveJobChanges(target);
          return;
        }

        if(
          target.classList.contains(
            "pause-job-button"
          )
        ){
          await pauseJob(target);
          return;
        }

        if(
          target.classList.contains(
            "republish-job-button"
          )
        ){
          await republishJob(target);
          return;
        }

        if(
          target.classList.contains(
            "top-on-button"
          )
        ){
          await turnOnTopFeatured(target);
          return;
        }

        if(
          target.classList.contains(
            "top-off-button"
          )
        ){
          await turnOffTopFeatured(target);
          return;
        }

        if(
          target.classList.contains(
            "end-job-button"
          )
        ){
          await endJob(target);
          return;
        }

        if(
          target.classList.contains(
            "delete-job-button"
          )
        ){
          await deletePublishedJob(target);
        }
      }
    );

    document.addEventListener(
      "change",
      (event) => {

        const target = event.target;

        if(
          !target.id.startsWith("editImage-")
        ){
          return;
        }

        const jobId =
          target.id.replace(
            "editImage-",
            ""
          );

        const file =
          target.files?.[0];

        if(!file){
          return;
        }

        if(!file.type.startsWith("image/")){
          alert(
            "画像ファイルを選択してください"
          );

          target.value = "";
          return;
        }

        const preview =
          document.getElementById(
            `editPreview-${jobId}`
          );

        preview.src =
          URL.createObjectURL(file);

        preview.classList.add("show");
      }
    );

    function openEditForm(jobId){

      const form =
        document.getElementById(
          `editForm-${jobId}`
        );

      if(!form){
        return;
      }

      form.classList.add("open");

      form.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });
    }

    function closeEditForm(jobId){

      const form =
        document.getElementById(
          `editForm-${jobId}`
        );

      if(form){
        form.classList.remove("open");
      }
    }

    /* =========================
       店舗情報保存
    ========================= */

    async function saveJobChanges(button){

      const jobId =
        button.dataset.jobId;

      const statusElement =
        document.getElementById(
          `saveStatus-${jobId}`
        );

      const storeName =
        document.getElementById(
          `editStoreName-${jobId}`
        ).value.trim();

      const businessType =
        document.getElementById(
          `editBusinessType-${jobId}`
        ).value.trim();

      const position = document.getElementById(`editPosition-${jobId}`).value.trim();

      const area =
        document.getElementById(
          `editArea-${jobId}`
        ).value.trim();

      const salary =
        document.getElementById(
          `editSalary-${jobId}`
        ).value.trim();

      const title =
        document.getElementById(
          `editTitle-${jobId}`
        ).value.trim();

      const description =
        document.getElementById(
          `editDescription-${jobId}`
        ).value.trim();

      const workHours =
        document.getElementById(
          `editWorkHours-${jobId}`
        ).value.trim();

      const requirements =
        document.getElementById(
          `editRequirements-${jobId}`
        ).value.trim();

      const benefits =
        document.getElementById(
          `editBenefits-${jobId}`
        ).value.trim();

      const address = document.getElementById(`editAddress-${jobId}`).value.trim();
      const station = document.getElementById(`editStation-${jobId}`).value.trim();

      const back = document.getElementById(`editBack-${jobId}`).value.trim();
      const parseOptionalBoolean = (elementId) => {
        const selected = document.getElementById(elementId).value;
        return selected === "" ? "" : selected === "true";
      };
      const dailyPay = parseOptionalBoolean(`editDailyPay-${jobId}`);
      const trial = parseOptionalBoolean(`editTrial-${jobId}`);
      const beginner = parseOptionalBoolean(`editBeginner-${jobId}`);
      const age = document.getElementById(`editAge-${jobId}`).value.trim();
      const shift = document.getElementById(`editShift-${jobId}`).value.trim();
      const targetGender = document.getElementById(`editTargetGender-${jobId}`).value;
      const businessScope = document.getElementById(`editBusinessScope-${jobId}`).value;

      const applyUrl =
        document.getElementById(
          `editApplyUrl-${jobId}`
        ).value.trim();

      const topOrder =
        Number(
          document.getElementById(
            `editTopOrder-${jobId}`
          ).value
        ) || 999;

      const status =
        document.getElementById(
          `editStatus-${jobId}`
        ).value;

      const imageInput =
        document.getElementById(
          `editImage-${jobId}`
        );

      if(!storeName){
        alert(
          "店舗名を入力してください"
        );
        return;
      }

      if(
        applyUrl &&
        !validateUrl(applyUrl)
      ){
        alert(
          "応募リンクを正しく入力してください"
        );
        return;
      }

      button.disabled = true;
      button.textContent = "保存中...";

      statusElement.className =
        "edit-save-status";

      statusElement.textContent =
        "変更内容を保存しています...";

      try{
        const jobReference =
          doc(db,"jobs",jobId);

        const jobSnapshot =
          await getDoc(jobReference);

        if(!jobSnapshot.exists()){
          throw new Error(
            "求人データが見つかりません"
          );
        }

        const oldData =
          jobSnapshot.data();

        let mainImage =
          getJobImage(oldData);

        const selectedFile =
          imageInput.files?.[0];

        if(selectedFile){

          if(
            selectedFile.size >
            8 * 1024 * 1024
          ){
            throw new Error(
              "画像サイズは8MB以下にしてください"
            );
          }

          const extension =
            selectedFile.name
              .split(".")
              .pop()
              ?.toLowerCase()
              .replace(
                /[^a-z0-9]/g,
                ""
              ) || "jpg";

          const imageReference =
            ref(
              storage,
              `job-images/${jobId}/${Date.now()}.${extension}`
            );

          await uploadBytes(
            imageReference,
            selectedFile,
            {
              contentType:
                selectedFile.type
            }
          );

          mainImage =
            await getDownloadURL(
              imageReference
            );
        }

      const updatedImages =
  mainImage
    ? [mainImage]
    : [];

        await manageAdminJobCallable({
          action:"update",
          jobId,
          changes:{
            storeName,
            shopName:storeName,
            name:storeName,

            businessType,
            jobType:businessType,
            category:businessType,
            position,

            area,
            location:area,

            salary,
            salaryText:salary,

            address,
            workLocation:address,
            station,
            nearestStation:station,

            title,
            jobTitle:title,

            description,
            jobDescription:description,
            storeDescription:description,
            selfPr:description,

            workHours,
            workingHours:workHours,

            requirements,
            qualification:requirements,

            benefits,
            treatment:benefits,

            back,
            dailyPay,
            trial,
            beginner,
            age,
            shift,
            targetGender,
            businessScope,

            applyUrl,
            lineUrl:applyUrl,
            contactUrl:applyUrl,

            topOrder,
            status,

            mainImage,
            imageUrl:mainImage,
            image:mainImage,
            images:updatedImages,

          }
        });

        statusElement.className =
          "edit-save-status success";

        statusElement.textContent =
          "求人情報を更新しました";

        imageInput.value = "";

        window.setTimeout(
          async () => {
            await loadPublishedJobs();
          },
          700
        );

      }catch(error){

        console.error(
          "店舗編集保存エラー:",
          error
        );

        statusElement.className =
          "edit-save-status error";

        statusElement.textContent =
          error.message ||
          "保存に失敗しました";

        button.disabled = false;
        button.textContent =
          "変更を保存";
      }
    }

    /* =========================
       申請承認
    ========================= */

    async function approveApplicationWithCallable(
      button
    ){

      const applicationId =
        button.dataset.applicationId;

      if(
        !confirm(
          "この申請を承認して求人ページへ公開しますか？"
        )
      ){
        return;
      }

      button.disabled = true;
      button.textContent =
        "公開処理中...";

      try{
        await approveJobApplicationCallable({
          applicationId
        });

        alert(
          "承認して公開しました"
        );

        await Promise.all([
          loadPendingJobs(),
          loadPublishedJobs()
        ]);

      }catch(error){
        const code =
          typeof error?.code === "string"
            ? error.code
            : "";
        const messages = {
          "functions/unauthenticated":
            "ログイン状態を確認してください。",
          "functions/permission-denied":
            "求人を承認する管理者権限がありません。",
          "functions/invalid-argument":
            "承認対象の指定が正しくありません。",
          "functions/not-found":
            "対象の求人掲載申請が見つかりません。",
          "functions/failed-precondition":
            "店舗の契約または掲載状態を確認できないため、求人を公開できません。",
          "functions/internal":
            "求人を承認できませんでした。NOX運営で状態を確認してください。"
        };

        alert(
          messages[code] ||
          "求人を承認できませんでした。"
        );

      }finally{

        button.disabled = false;
        button.textContent =
          "承認して公開";
      }
    }

    async function deleteApplication(button){

      const applicationId =
        button.dataset.applicationId;

      if(
        !confirm(
          "この承認待ち申請を削除しますか？\n削除後は元に戻せません。"
        )
      ){
        return;
      }

      button.disabled = true;
      button.textContent =
        "削除中...";

      try{
        await deleteDoc(
          doc(
            db,
            "jobApplications",
            applicationId
          )
        );

        alert(
          "申請を削除しました"
        );

        await loadPendingJobs();

      }catch(error){

        console.error(
          "申請削除エラー:",
          error
        );

        alert(
          `申請を削除できませんでした：${
            error.message || error
          }`
        );

      }finally{

        button.disabled = false;
        button.textContent =
          "申請を削除";
      }
    }

        );

      }finally{

        button.disabled = false;
        button.textContent =
          "トップ掲載OFF";
      }
    }

    async function endJob(button){
      const jobId = button.dataset.jobId;
      if(!confirm("この求人の掲載を終了しますか？")) return;
      button.disabled = true;
      button.textContent = "終了処理中...";
      try{
        await manageAdminJobCallable({ action:"end", jobId });
        alert("求人掲載を終了しました");
        await loadPublishedJobs();
      }catch(error){
        console.error(error);
        alert(error?.message || "求人掲載を終了できませんでした");
      }finally{
        button.disabled = false;
        button.textContent = "掲載終了";
      }
    }

    /* =========================
       完全削除
    ========================= */

    async function deletePublishedJob(button){

      const jobId =
        button.dataset.jobId;

      if(
        !confirm(
          "この掲載店舗を完全削除しますか？\n元に戻せません。"
        )
      ){
        return;
      }

      if(
        !confirm(
          "本当に完全削除してよろしいですか？"
        )
      ){
        return;
      }

      button.disabled = true;
      button.textContent =
        "削除中...";

      try{
        await manageAdminJobCallable({ action:"delete", jobId });

        alert(
          "掲載店舗を完全削除しました"
        );

        await loadPublishedJobs();

      }catch(error){

        console.error(error);

        alert(
          "削除できませんでした"
        );

      }finally{

        button.disabled = false;
        button.textContent =
          "完全削除";
      }
    }

  </script>

</body>
