<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>NOX MARKET 管理</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="market.css"></head><body class="market-body" style="visibility:hidden"><header class="market-header"><a class="market-logo" href="market.html">NOX <span>MARKET</span> ADMIN</a><nav class="market-nav"><a href="market.html" target="_blank">公開ページ</a><a href="admin.html">NOX管理画面</a></nav></header><main class="market-section"><div class="market-heading"><div><p class="eyebrow">ADMINISTRATION</p><h1>NOX MARKET 管理</h1></div><p data-state>読み込み中…</p></div><div class="admin-tabs"><button class="market-button" data-tab="products">商品管理</button><button class="market-button secondary" data-tab="donations">提供申請</button></div><section data-panel="products"><form class="admin-form" data-product-form><input type="hidden" name="id"><h2 data-product-form-title>商品を追加</h2><div class="form-grid"><label class="market-field">商品名<input name="name" maxlength="120" required></label><label class="market-field">販売価格<input name="price" type="number" min="0" step="1" required></label><label class="market-field">カテゴリ<select name="category" data-category required></select></label><label class="market-field">ブランド名<input name="brand" maxlength="100"></label><label class="market-field">商品の状態<select name="condition" data-condition required></select></label><label class="market-field">在庫数<input name="stock" type="number" min="0" step="1" value="1" required></label><label class="market-field">サイズ<input name="size" maxlength="80"></label><label class="market-field">カラー<input name="color" maxlength="80"></label><label class="market-field full">商品説明<textarea name="description" maxlength="3000" required></textarea></label><label class="market-field full">注意事項<textarea name="caution" maxlength="2000"></textarea></label><label class="market-field full">商品画像（追加・最大10枚）<input name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>編集時に選択した画像は既存画像へ追加されます。</small></label><label class="agreement-check"><input name="isPublic" type="checkbox"><span>公開する</span></label><label class="agreement-check"><input name="soldOut" type="checkbox"><span>SOLD OUT</span></label></div><div class="market-actions" style="justify-content:flex-start"><button class="market-button" type="submit">保存</button><button class="market-button secondary" type="button" data-cancel-edit>入力をリセット</button></div><p class="form-message" data-product-message></p></form><div class="admin-list" data-products></div></section><section class="hidden" data-panel="donations"><div class="admin-list" data-donations></div></section></main><script type="module" src="market-admin.js"></script></body></html>
